[project]
name = "fastmcp-annuaire-gouv"
version = "0.1.0"
description = "MCP server for querying the French health directory API (Annuaire Sante)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
annuaire-mcp = "annuaire_mcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annuaire_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.15.10",
    "respx>=0.21.0",
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=annuaire_mcp --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/annuaire_mcp"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff.lint.isort]
known-first-party = ["annuaire_mcp"]
